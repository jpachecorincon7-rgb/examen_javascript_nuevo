
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PLANOVA: gestor de tareas para crear, editar, filtrar e importar tus pendientes.">
    <title>TASKSNAP - Gestión de Tareas</title>
 
    <!-- Ícono incrustado: evita el error 404 de favicon.ico en la consola -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128203;</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
 
<body>
 
    <header>
        <h1>TASKSNAP</h1>
        <span>Organiza tus ideas, cumple tus metas.</span>
    </header>
 
    <main class="contenedor">
        <!-- task-app dibuja el resumen, las herramientas y la lista.
             task-modal e import-modal los crea o usa task-app cuando se necesitan. -->
        <task-app></task-app>
 
        <noscript>
            <p>Esta aplicación necesita JavaScript activado para funcionar.</p>
        </noscript>
    </main>
 
    <!-- type="module" es obligatorio: los archivos usan import/export.
         taskapp.js importa a taskmodal.js, importmodal.js y a los servicios. -->
    <script type="module" src="js/components/taskapp.js"></script>
</body>
</html>
